name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_DATA: fallback
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test --grep-invert "actual oscillator deadlines"
      - name: Verify audio-clock timing in isolation
        run: pnpm exec playwright test tests/drum-browser.spec.ts --project=desktop-chromium --workers=1 --grep "actual oscillator deadlines" --output=test-results/audio-clock
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-audio-clock-report
      - run: pnpm test:edge
      - run: pnpm perf
        env:
          # Hosted Ubuntu blocks Chromium user namespaces; audits serve only local static output.
          LHCI_COLLECT__SETTINGS__CHROME_FLAGS: "--no-sandbox"
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-reports
          include-hidden-files: true
          path: |
            playwright-report/
            playwright-audio-clock-report/
            test-results/
            .lighthouseci/
          if-no-files-found: ignore
